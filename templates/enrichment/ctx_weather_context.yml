cubes:
  - name: CtxWeatherContext
    sql: SELECT * FROM enrich.weather_context_v WHERE country_code = 'IS'
    public: true
    meta:
      default_model: true
      managed_by: ctx-enrichment
      template: ctx_weather_context
      source_table: weather_context_v
      weather_country: IS
      billing_items:
        - ctx:weather-archetype
    dimensions:
      - name: contextKey
        sql: concat({CUBE}.request_geohash6, ':IS:', toString({CUBE}.local_date))
        type: string
        primary_key: true
        public: false
      - name: requestGeohash6
        sql: request_geohash6
        type: string
      - name: countryCode
        sql: country_code
        type: string
      - name: localDate
        sql: local_date
        type: time
      - name: timezone
        sql: timezone
        type: string
      - name: valueBasis
        sql: value_basis
        type: string
      - name: forecastLeadHours
        sql: forecast_lead_h
        type: number
      - name: contextAsOf
        sql: ctx_as_of
        type: time
      - name: temperature
        sql: temperature
        type: number
      - name: feelsLike
        sql: feels_like
        type: number
      - name: precipitationRain
        sql: precipitation_rain
        type: number
      - name: precipitationSnow
        sql: precipitation_snow
        type: number
      - name: windSpeed
        sql: wind_speed
        type: number
      - name: windDirection
        sql: wind_direction
        type: number
      - name: windGust
        sql: wind_gust
        type: number
      - name: cloudCover
        sql: cloud_cover
        type: number
      - name: pressure
        sql: pressure
        type: number
      - name: humidity
        sql: humidity
        type: number
      - name: dewPoint
        sql: dew_point
        type: number
      - name: visibility
        sql: visibility
        type: number
      - name: icon
        sql: icon
        type: string
      - name: temperatureRegime
        sql: temp_regime
        type: string
      - name: precipitationType
        sql: precip_type
        type: string
      - name: precipitationIntensity
        sql: precip_intensity
        type: string
      - name: windRegime
        sql: wind_regime
        type: string
      - name: skyCondition
        sql: sky_condition
        type: string
      - name: weatherMarker
        sql: weather_marker
        type: string
      - name: wordCloud
        sql: arrayStringConcat(word_cloud, ', ')
        type: string
      - name: sourceGeohash
        sql: source_geohash
        type: string
      - name: resolution
        sql: resolution
        type: number
      - name: snapshotId
        sql: snapshot_id
        type: string
      - name: refreshedAt
        sql: refreshed_at
        type: time
