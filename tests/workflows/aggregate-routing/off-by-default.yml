# Aggregate routing (015) is off unless AGGREGATE_ROUTING_ENABLED=true (FR-027,
# SC-004): the model list, the generated statements and the answers are what
# they were before the feature. Like the model-management workflows, this one
# expects the dev stack up and the captures of a signed-in, seeded run
# (accessToken, datasourceId, cubeName).
tests:
  aggregate_routing_off_by_default:
    steps:
      - name: meta_lists_the_model_as_before
        http:
          url: http://cubejs:4000/api/v1/meta
          method: GET
          headers:
            Authorization: Bearer ${{captures.accessToken}}
            x-hasura-datasource-id: ${{captures.datasourceId}}
          check:
            status: 200
            jsonpath:
              $.cubes:
                - isArray: true

      - name: statement_reads_no_aggregate_table
        http:
          url: http://cubejs:4000/api/v1/sql
          method: POST
          headers:
            Content-Type: application/json
            Authorization: Bearer ${{captures.accessToken}}
            x-hasura-datasource-id: ${{captures.datasourceId}}
          json:
            query:
              measures: ["${{captures.cubeName}}.count"]
          check:
            status: 200
            jsonpath:
              $.sql.sql[0]:
                - match: "^(?![\\s\\S]*__agg_)[\\s\\S]*$"

      - name: answer_carries_no_coverage_mark
        http:
          url: http://cubejs:4000/api/v1/load
          method: POST
          headers:
            Content-Type: application/json
            Authorization: Bearer ${{captures.accessToken}}
            x-hasura-datasource-id: ${{captures.datasourceId}}
          json:
            query:
              measures: ["${{captures.cubeName}}.count"]
          check:
            status: 200
            headers:
              x-synmetrix-aggregate-covered-until:
                - isDefined: false
