# A disposable ClickHouse cluster for the aggregate cluster test: one shard,
# three replicas, as on the real cluster. ch1 also runs the coordination
# service. Data lives in memory. Reachable from this machine only.
#   docker compose -f test/aggregates/cluster/docker-compose.yml up -d
#   yarn test:aggregates:cluster
x-node: &node
  image: clickhouse/clickhouse-server:26.8.7.19
  tmpfs:
    - /var/lib/clickhouse
  ulimits:
    nofile:
      soft: 262144
      hard: 262144

services:
  ch1:
    <<: *node
    hostname: ch1
    environment: { CLICKHOUSE_USER: test, CLICKHOUSE_PASSWORD: test, CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1, CH_REPLICA: ch1 }
    ports: ["127.0.0.1:18131:8123"]
    volumes:
      - ./cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./keeper.xml:/etc/clickhouse-server/config.d/keeper.xml:ro
  ch2:
    <<: *node
    hostname: ch2
    environment: { CLICKHOUSE_USER: test, CLICKHOUSE_PASSWORD: test, CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1, CH_REPLICA: ch2 }
    ports: ["127.0.0.1:18132:8123"]
    volumes:
      - ./cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
    depends_on: [ch1]
  ch3:
    <<: *node
    hostname: ch3
    environment: { CLICKHOUSE_USER: test, CLICKHOUSE_PASSWORD: test, CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1, CH_REPLICA: ch3 }
    ports: ["127.0.0.1:18133:8123"]
    volumes:
      - ./cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
    depends_on: [ch1]
