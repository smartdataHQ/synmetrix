openapi: 3.1.0
info:
  title: Synmetrix Model Management — Dataschema Deletion
  version: "011.2"
paths:
  /api/v1/dataschema/{dataschemaId}:
    delete:
      operationId: deleteDataschema
      summary: Delete a dataschema from the latest version of the active branch.
      description: |
        Writes a NEW version on the branch holding every other file of the current
        version; the version the file was removed from stays intact, so the delete
        can be undone with a rollback. Blocked if:
        - The caller lacks owner/admin role on the datasource team (FR-006) → 403.
        - The dataschema belongs to a version that is NOT the latest version of the
          active branch (FR-007) → 409.
        - Any other cube on the same branch references the target cube (FR-008) → 409.
        The seven reference kinds detected are enumerated in FR-008 and in the
        BlockingReference enum below.

        AUTH: dataschema-scoped endpoint. Direct-verify; no `x-hasura-datasource-id`
        header required or accepted. The handler resolves dataschema → version →
        branch → datasource server-side from the path parameter.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: dataschemaId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Dataschema removed; `versionId` is the new current version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteDataschemaResponse' }
        "403":
          description: |
            Authorization failure. Possible codes:
            - `delete_blocked_authorization` — caller lacks owner/admin role on the datasource team.
            Missing or malformed JWT also returns 403 with a non-business-specific code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "404":
          description: Dataschema not found or not visible to caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "409":
          description: |
            Delete blocked by a structural constraint. Possible codes:
            - `delete_blocked_by_references` — cross-cube references still depend on the target (FR-008).
            - `delete_blocked_historical_version` — the dataschema is not on the latest version of the active branch (FR-007).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteBlockedResponse' }
    put:
      operationId: updateDataschema
      summary: Save one dataschema's code as a new version of its branch.
      description: |
        Copies every file of the dataschema's version into a NEW version and
        replaces this file's code; the previous version stays restorable.
        Identical code is a no-op (200, `unchanged: true`, no new version).
        Same guards as DELETE: owner/admin → else 403 `update_blocked_authorization`;
        the dataschema must be on the current version of the active branch →
        else 409 `update_blocked_historical_version`.

        AUTH: direct-verify, as DELETE.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: dataschemaId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: Saved (or unchanged).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateDataschemaResponse' }
        "400":
          description: "Body is not `{code: string}` (`update_invalid_request`)."
        "403":
          description: "`update_blocked_authorization` (partition or role)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "404":
          description: Dataschema not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "409":
          description: "`update_blocked_historical_version`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorCode:
      type: string
      description: |
        Canonical Synmetrix Model-Management API error code (FR-017).
        Single source of truth: services/cubejs/src/utils/errorCodes.js.
      enum:
        - validate_invalid_mode
        - validate_target_not_found
        - validate_unresolved_reference
        - refresh_branch_not_visible
        - refresh_unauthorized
        - delete_blocked_by_references
        - delete_blocked_historical_version
        - delete_blocked_authorization
        - cube_not_found
        - diff_cross_branch
        - diff_invalid_request
        - rollback_version_not_on_branch
        - rollback_blocked_authorization
        - rollback_invalid_request
        - rollback_source_columns_missing
        - update_blocked_historical_version
        - update_blocked_authorization
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }
    DeleteDataschemaResponse:
      type: object
      required: [deleted, dataschemaId]
      properties:
        deleted: { type: boolean }
        dataschemaId: { type: string, format: uuid }
        versionId:
          type: string
          format: uuid
          description: The new current version (without the deleted file).
        branchId: { type: string, format: uuid }
    UpdateDataschemaResponse:
      type: object
      required: [versionId, branchId, dataschema]
      properties:
        versionId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        unchanged:
          type: boolean
          description: Present (true) when the code was identical and nothing was written.
        dataschema:
          type: object
          required: [id, name, checksum, version_id]
          properties:
            id: { type: string, format: uuid, description: The NEW row's id. }
            name: { type: string }
            checksum: { type: string }
            version_id: { type: string, format: uuid }
    DeleteBlockedResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Subset of ErrorCode applicable to 409 outcomes.
          enum:
            - delete_blocked_by_references
            - delete_blocked_historical_version
        message: { type: string }
        blockingReferences:
          type: array
          description: Present when code=delete_blocked_by_references.
          items:
            type: object
            required: [referringCube, file, referenceKind]
            properties:
              referringCube: { type: string }
              file: { type: string }
              referenceKind:
                type: string
                enum:
                  - joins
                  - extends
                  - sub_query
                  - formula
                  - segment
                  - pre_aggregation
                  - filter_params
              line: { type: [integer, "null"] }
